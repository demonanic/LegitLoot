<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LegitLoot Admin · Reward Disputes</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="portal.css"></head><body><main class="portal-main"><section class="section-wrap portal-hero"><h1>REWARD <span class="acid">DISPUTES</span></h1><p>Restricted admin workflow. Admin access is verified by the server for every request.</p><div id="status" class="notice-panel" role="status">Checking session…</div><form id="signin" class="auth-form"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" required><button class="primary-btn">Sign in</button></form><div id="queue" hidden><label for="filter">Status</label><select id="filter"><option value="">All</option><option>open</option><option>under_review</option><option>resolved</option><option>rejected</option><option>closed</option></select><div id="items"></div><button id="logout" class="filter-chip">Sign out</button></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{const c=window.supabase.createClient("https://scmnxcsggquwtuyyjnnj.supabase.co","sb_publishable_ukFXb72cBXgcbgJIaQhD5w_NPIR7dGS");const $=id=>document.getElementById(id);const msg=(s)=>$("status").textContent=s;async function load(){const {data,error}=await c.rpc("admin_list_reward_disputes",{p_status:$("filter").value||null});if(error){msg("Admin permission denied or queue unavailable.");return;}const box=$("items");box.replaceChildren();(data||[]).forEach(d=>{const a=document.createElement("article");a.className="history-panel";const h=document.createElement("h2");h.textContent=d.provider+" · "+d.status;const p=document.createElement("p");p.textContent=d.description;const meta=document.createElement("small");meta.textContent="Created "+new Date(d.createdAt).toLocaleString()+" · ID "+d.id;a.append(h,p,meta);if(d.offerReference){const ref=document.createElement("p");ref.textContent="Reference: "+d.offerReference;a.append(ref);}const f=document.createElement("form");f.className="auth-form";const st=document.createElement("select");["under_review","resolved","rejected","closed"].forEach(v=>{const o=document.createElement("option");o.value=v;o.textContent=v;o.selected=v===d.status;st.append(o);});const resolution=document.createElement("textarea");resolution.placeholder="Resolution / response (required for resolved/rejected)";resolution.rows=3;resolution.value=d.resolution||"";const note=document.createElement("textarea");note.placeholder="Internal audit note explaining this action (required)";note.rows=2;const b=document.createElement("button");b.className="primary-btn";b.textContent="Save status";f.append(st,resolution,note,b);f.addEventListener("submit",async e=>{e.preventDefault();b.disabled=true;const {error}=await c.rpc("admin_update_reward_dispute",{p_id:d.id,p_status:st.value,p_resolution:resolution.value,p_note:note.value});b.disabled=false;if(error){alert(error.message);return;}await load();});a.append(f);box.append(a);});}$("signin").addEventListener("submit",async e=>{e.preventDefault();const {error}=await c.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error){msg("Sign-in failed.");return;}await boot();});$("filter").addEventListener("change",load);$("logout").addEventListener("click",async()=>{await c.auth.signOut();$("queue").hidden=true;$("signin").hidden=false;msg("Signed out.");});async function boot(){const {data}=await c.auth.getSession();if(!data.session){$("queue").hidden=true;$("signin").hidden=false;msg("Sign in with an authorized admin account.");return;}$("signin").hidden=true;$("queue").hidden=false;msg("Session active. Server-side admin check is enforced.");await load();}boot();})();</script></body></html>
