name: Offerwall.GG wall URL Deno tests

on:
  pull_request:
    paths:
      - "supabase/functions/offerwall-gg-wall-url/**"
      - ".github/workflows/offerwall-gg-wall-url-deno-tests.yml"
  push:
    branches:
      - "claude/offerwall-gg-wall-url-source-align"
    paths:
      - "supabase/functions/offerwall-gg-wall-url/**"
      - ".github/workflows/offerwall-gg-wall-url-deno-tests.yml"

permissions:
  contents: read

jobs:
  deno-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.8
      - name: Type-check Edge Function entrypoint
        run: deno check supabase/functions/offerwall-gg-wall-url/index.ts
      - name: Test inert Offerwall.GG wall URL handler
        run: deno test supabase/functions/offerwall-gg-wall-url/index_test.ts
