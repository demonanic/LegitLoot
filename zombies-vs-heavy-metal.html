<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101110">
<meta name="description" content="Play Zombies vs Heavy Metal free in your browser: build turrets, hold the stronghold, survive the horde. Early access on LegitLoot.">
<title>Play Zombies vs Heavy Metal — LegitLoot</title>
<meta property="og:title" content="Zombies vs Heavy Metal — play free on LegitLoot">
<meta property="og:description" content="Build turrets, hold the stronghold, survive the horde. Early access, free in your browser.">
<meta property="og:url" content="https://legitloot.site/zombies-vs-heavy-metal">
<link rel="icon" href="assets/legitloot-mark.svg" type="image/svg+xml">
<style>
  html, body { margin: 0; height: 100%; background: #101110; color: #e9e4d8; font: 14px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  .bar { flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 10px; padding-top: max(6px, env(safe-area-inset-top)); background: #161816; border-bottom: 1px solid #3a3d39; }
  .brand { display: flex; align-items: center; gap: 6px; color: inherit; text-decoration: none; font-weight: 800; letter-spacing: .02em; white-space: nowrap; }
  .brand img { width: 22px; height: 22px; }
  .brand .acid { color: #c4f542; }
  .title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 700; text-transform: uppercase; font-size: 12px; letter-spacing: .04em; color: #b9b4a8; }
  .tag { color: #c4f542; font-size: 10px; margin-left: 6px; }
  .bar a.btn, .bar button { min-height: 34px; padding: 0 10px; border: 1px solid #5a5e58; background: transparent; color: inherit; font: 700 11px system-ui, sans-serif; text-transform: uppercase; letter-spacing: .03em; text-decoration: none; display: inline-flex; align-items: center; cursor: pointer; white-space: nowrap; }
  .bar a.btn:hover, .bar button:hover { border-color: #e9e4d8; }
  .stage { flex: 1; min-height: 0; background: #0b0c0b; }
  .stage iframe { display: block; width: 100%; height: 100%; border: 0; }
  @media (max-width: 420px) { .title { display: none; } }
</style>
<link rel="stylesheet" href="game-awards.css?v=1">
</head>
<body>
  <header class="bar">
    <a class="brand" href="games.html" aria-label="Back to LegitLoot games"><img src="assets/legitloot-mark.svg" alt=""><span>LEGIT<span class="acid">LOOT</span></span></a>
    <span class="title">Zombies vs Heavy Metal<span class="tag">Early access</span></span>
    <button id="awards-btn" type="button" aria-controls="awards-drawer" aria-expanded="false" hidden>Awards<span id="awards-count"></span></button>
    <button id="full" type="button" hidden>Full screen</button>
    <a class="btn" href="games.html">Exit</a>
  </header>
  <main class="stage">
    <iframe id="game" src="https://demonanic.github.io/Legitloot-2/" title="Zombies vs Heavy Metal" allow="fullscreen; autoplay" allowfullscreen></iframe>
    <div id="awards-toast" class="awards-toast" role="status" aria-live="polite" hidden></div>
    <aside id="awards-drawer" class="awards-drawer" aria-label="Awards" hidden>
      <header><h2>Awards</h2><button type="button" data-close>Close</button></header>
      <p id="awards-note"></p>
      <ul id="awards-list"></ul>
    </aside>
  </main>
  <script>
    (function () {
      var btn = document.getElementById("full");
      var stage = document.querySelector(".stage");
      if (!stage.requestFullscreen) return;
      btn.hidden = false;
      btn.addEventListener("click", function () {
        stage.requestFullscreen().catch(function () {});
      });
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="game-awards.js?v=1"></script>
  <script src="game-awards-bridge.js?v=1" data-game="zvhm" data-frame="game" data-origin="https://demonanic.github.io"></script>
</body>
</html>
